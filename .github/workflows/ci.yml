name: CI

# Runs on every PR and every push to main. Nothing here touches Azure - a real Postgres
# service container stands in, the same way a local dev sets PG_TEST_DSN.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests (unit + DB-backed, all 98)
        run: pytest
        env:
          PG_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      # -backend=false: this job only validates syntax and provider schemas, it never touches
      # real state, so it does not need the remote backend from backend.hcl.example.
      - name: Init (no backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate
        working-directory: infra
        run: terraform validate
